name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # ait build 는 배포 산출물이라 CI 에서 뺀다.
      - run: npm run build:web

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      # openapi.json 이 정본이라고 문서가 말한다. 코드와 어긋난 채 머지되지 않게 막는다.
      - run: ALLOW_UNVERIFIED_ANON_KEY=true uv run python scripts/export_openapi.py
      - run: git diff --exit-code ../docs/openapi.json
